<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <!-- Leftover Arial requests follow the same face the sidebar uses.
       The real Arial files stay hidden so Qt cannot open them by name. -->
  <match target="pattern">
    <test qual="first" name="family"><string>Arial</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Sarasa UI SC</string></edit>
  </match>
  <match target="pattern">
    <test qual="first" name="family"><string>ArialMT</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Sarasa UI SC</string></edit>
  </match>
  <match target="pattern">
    <test qual="first" name="family"><string>Arial MT</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Sarasa UI SC</string></edit>
  </match>
  <selectfont>
    <rejectfont>
      <pattern>
        <patelt name="file"><string>/usr/share/fonts/arial/arial.ttf</string></patelt>
      </pattern>
      <pattern>
        <patelt name="file"><string>/usr/share/fonts/arial/arialbd.ttf</string></patelt>
      </pattern>
      <pattern>
        <patelt name="file"><string>/usr/share/fonts/arial/ariali.ttf</string></patelt>
      </pattern>
    </rejectfont>
  </selectfont>
</fontconfig>
