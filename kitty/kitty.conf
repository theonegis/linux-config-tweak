# --- Font ---
font_family      JetBrainsMono Nerd Font Mono
font_size        14.0
# Kitty 的 offset 默认为 0，如需微调可取消下方注释
# modify_font cell_width 0
 modify_font cell_height 110%

# --- Window & Appearance ---
hide_window_decorations yes
background_opacity 0.6
background_blur 1
window_padding_width 8 10
# dynamic_padding 行为在 Kitty 中是内置默认的，无需额外配置

# --- Keyboard Shortcuts ---
# 复制粘贴（Kitty 默认即为此快捷键）
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard

# 快捷键动作在 Alacritty 配置中未完全提供，按通用设置映射：
# 显示/隐藏滚屏搜索框
map ctrl+shift+f show_scrollback
# 跳转到上一个匹配项
map ctrl+shift+b show_scrollback --previous

# 启用光标拖尾动画（数值表示触发动画的时间间隔阈值，一般设为 1 或 3）
cursor_trail 1

# 控制光标拖尾衰减的速度（两个值分别为渐隐起始时间与结束时间）
# 较小的数值衰减更快，显得灵动；较大数值拖尾更长、更炫酷
cursor_trail_decay 0.1 0.45

# 默认 'none' 会跟随当前光标背景色，你也可以设置指定颜色，例如 HEX 颜色：
# cursor_trail_color #87ff00

# 触发拖尾的最小移动距离（单位：字符格数）
# 设为 2 表示只有光标跳跃/移动超过 2 个字符时才触发拖尾，避免微小移动过于打扰
cursor_trail_start_threshold 2
cursor_blink_interval -1 ease-in-out
custom_shaders cursor-trail-motion-blur
